# VTT Explorer — Build APK via GitHub Actions (gratuit)
#
# Déclenchement :
#   - push sur main / master
#   - bouton "Run workflow" (Actions → Build APK → Run workflow)
#
# Résultat : artifact "VTTExplorer-debug" contenant app-debug.apk

name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android platform & build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          # Clé optionnelle : Settings → Secrets and variables → Actions → GRAPHHOPPER_API_KEY
          if [ -n "${{ secrets.GRAPHHOPPER_API_KEY }}" ]; then
            echo "GRAPHHOPPER_API_KEY=${{ secrets.GRAPHHOPPER_API_KEY }}" >> local.properties
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTTExplorer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo "## VTT Explorer — Build OK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Téléchargez l'artifact **VTTExplorer-debug** en bas de cette page." >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ || true
